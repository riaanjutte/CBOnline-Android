name: Publish website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "tests/site/**"
      - "README.md" # the site's FAQ must match the README's; the tests check it
      - ".github/workflows/pages.yml"
  # Pull requests only run the tests; nothing is published
  pull_request:
    paths:
      - "site/**"
      - "tests/site/**"
      - "README.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --test "tests/site/*.test.mjs"

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    # One publish at a time; never cancel one that's already running
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
